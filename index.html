<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stadt Land Fluss — online spielen</title>
<meta name="description" content="Stadt Land Fluss mit Freunden: Raum erstellen, Link teilen, live mitspielen." />
<style>
:root {
  --bg: #f4f2ea;
  --paper: #ffffff;
  --ink: #202521;
  --muted: #80877c;
  --line: #e7e6dd;
  --green: #244f3c;
  --green-dark: #193d2d;
  --lime: #d9ed76;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  min-height: 100vh;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button { color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid rgba(36,79,60,.35); outline-offset: 2px; }
button:disabled { cursor: not-allowed; opacity: .55; }

.app-shell { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  width: min(640px, calc(100% - 40px));
  margin: 0 auto;
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand { border: 0; padding: 0; background: transparent; font-size: 16px; font-weight: 800; letter-spacing: -.02em; }
.link-button { border: 0; padding: 0; background: transparent; color: var(--green); font-size: 13px; font-weight: 700; }
.link-button:hover { text-decoration: underline; }
.room-pill { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: var(--paper); font-size: 12px; font-weight: 800; letter-spacing: .08em; }

.center-main, .room-main {
  width: min(480px, calc(100% - 40px));
  margin: 0 auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 20px;
  padding: 24px 0 48px;
}
.room-main { justify-content: flex-start; padding-top: 32px; }

.page-title {
  margin: 0;
  font-size: clamp(28px, 6vw, 38px);
  line-height: 1.08;
  letter-spacing: -.03em;
  font-weight: 800;
  text-align: center;
}

.card {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px;
  background: var(--paper);
}
.room-card { display: flex; flex-direction: column; gap: 16px; }

.field-label { display: block; margin: 16px 0 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.field-label:first-child { margin-top: 0; }
.text-input {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  outline: none;
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
}
.text-input::placeholder { color: #b6b9af; }
.text-input:focus { border-color: var(--green); }
.code-input { text-align: center; font-size: 18px; font-weight: 800; letter-spacing: .25em; }

.chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 10px; background: #eef1e2; color: #42532f; font-size: 12px; font-weight: 700; }
.chip-remove { display: grid; place-items: center; width: 14px; height: 14px; border: 0; border-radius: 50%; padding: 0; background: rgba(0,0,0,.08); font-size: 11px; line-height: 1; }
.add-row { display: flex; gap: 8px; margin-top: 8px; }
.add-row .text-input { height: 40px; }
.add-button { width: 40px; height: 40px; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 8px; background: #f5f5ef; font-size: 18px; }

.round-list { display: flex; gap: 8px; }
.round-choice { width: 42px; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font-size: 13px; font-weight: 700; }
.round-choice-active { border-color: var(--green); background: var(--green); color: #fff; }

.primary-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  border: 0;
  border-radius: 8px;
  padding: 0 16px;
  background: var(--green);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
}
.primary-button:not(:disabled):hover { background: var(--green-dark); }
.full-width { width: 100%; margin-top: 18px; }
.icon-svg { width: 16px; height: 16px; display: block; }
.icon-button { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); flex: 0 0 auto; }

.error-text { margin: 10px 0 0; color: #b14b36; font-size: 13px; }

.code-block { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.player-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

.host-tag { margin-left: auto; font-size: 10px; font-weight: 800; color: var(--green); }

.avatar { width: 28px; height: 28px; display: grid; flex: 0 0 auto; place-items: center; border-radius: 50%; font-size: 12px; font-weight: 800; color: #30392c; }
.a-1 { background: #f3d4c8; }
.a-2 { background: #dbe8ad; }
.a-3 { background: #ddd3f5; }
.a-4 { background: #cfe1ee; }
.a-5 { background: #f3dcac; }
.a-6 { background: #eed0d9; }

.round-row { display: flex; align-items: center; justify-content: space-between; }
.round-row > span:first-child { font-size: 13px; font-weight: 700; color: var(--muted); }
.letter-badge { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--lime); color: var(--green-dark); font-size: 22px; font-weight: 800; }

.answers-grid { display: flex; flex-direction: column; gap: 10px; }
.answer-field { display: block; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.answer-field span { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 700; color: var(--muted); }
.answer-field input { width: 100%; height: 24px; border: 0; outline: 0; padding: 0; background: transparent; color: var(--ink); font-size: 14px; }
.answer-field-invalid { border-color: #d6896f; }

.score-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.score-list li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.score-list li b { margin-left: auto; color: var(--green); }

.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.results-table { width: 100%; min-width: 420px; border-collapse: collapse; text-align: left; font-size: 13px; }
.results-table th, .results-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
.results-table thead th { color: var(--muted); font-size: 11px; font-weight: 700; }
.results-table tbody tr:last-child th, .results-table tbody tr:last-child td { border-bottom: 0; }
.results-table tbody th { font-weight: 700; }
.answer-empty { color: #b7bab0; }
.points-tag { margin-left: 6px; font-size: 11px; color: var(--muted); }

.winner-text { margin: 0; font-size: 20px; font-weight: 800; text-align: center; }

.mode-note { margin: 0 0 2px; color: var(--muted); font-size: 11px; text-align: center; }

@media (max-width: 480px) {
  .topbar, .center-main, .room-main { width: calc(100% - 28px); }
  .card { padding: 18px; }
  .code-block { flex-direction: column; align-items: stretch; }
  .code-actions { justify-content: space-between; }
}

<body>
<div class="app-shell">
  <header class="topbar" id="topbar"></header>
  <main id="main"></main>
</div>

<script>
"use strict";

/* =========================================================
   SUPABASE-KONFIGURATION (browser-taugliche Keys)
   Der Secret Key gehört NIE in diese Datei — nur in .env
   für serverseitige Nutzung.
   ========================================================= */
const SUPABASE_URL = "https://cfqqbmodhfbbempeyhah.supabase.co";
const SUPABASE_KEY = "sb_publishable_rShUuBqVgbKVC3N162qVQQ_r0GkRNe1";

/* =========================================================
   KONSTANTEN
   ========================================================= */
const DEFAULT_CATEGORIES = ["Stadt", "Land", "Fluss", "Vorname", "Tier", "Beruf"];
const LETTERS = [..."ABCDEFGHJKLMNPRSTUVWXYZ"];
const LOCAL_STORE_KEY = "wortwirbel-rooms";
const CHANNEL_NAME = "wortwirbel-live";
const AVATAR_COLORS = ["a-1", "a-2", "a-3", "a-4", "a-5", "a-6"];
const SCHEMA_HINT = "Supabase-Schema fehlt: führe supabase/schema.sql einmalig im Supabase SQL Editor aus. Bis dahin läuft das Spiel lokal (zweiter Tab).";

/* =========================================================
   STATE
   ========================================================= */
const state = {
  screen: "home",
  name: "",
  roomName: "",
  roomCode: "",
  playerId: "",
  snapshot: null,
  categories: [...DEFAULT_CATEGORIES],
  customCategory: "",
  roundLimit: 5,
  answers: {},
  busy: false,
  error: "",
  copied: false,
  lastRoundKey: "",
  online: false,      // true = Supabase, false = lokal (Tabs)
  schemaMissing: false,
  evaluating: false,
};

/* =========================================================
   HILFSFUNKTIONEN
   ========================================================= */
function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function uid() {
  if (window.crypto?.randomUUID) return window.crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    const v = c === "x" ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

function makeCode() {
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for (let i = 0; i < 6; i++) out += alphabet[Math.floor(Math.random() * alphabet.length)];
  return out;
}

function normalize(value) {
  return String(value ?? "").trim().toLocaleLowerCase("de-DE");
}

function avatarHtml(name, index) {
  const letter = String(name || "?").trim().slice(0, 1).toLocaleUpperCase("de-DE") || "?";
  return `<span class="avatar ${AVATAR_COLORS[index % AVATAR_COLORS.length]}" aria-hidden="true">${esc(letter)}</span>`;
}

function setError(message) {
  state.error = message || "";
}

function pickLetter(usedLetters) {
  const available = LETTERS.filter((letter) => !usedLetters.includes(letter));
  if (!available.length) return null;
  return available[Math.floor(Math.random() * available.length)];
}

function calculatePoints(categories, answers) {
  const pointsByPlayer = {};
  for (const answer of answers) pointsByPlayer[answer.player_id] = {};

  for (const category of categories) {
    const counts = {};
    for (const answer of answers) {
      const value = (answer.values || {})[category] || "";
      if (value) {
        const key = normalize(value);
        counts[key] = (counts[key] || 0) + 1;
      }
    }
    for (const answer of answers) {
      const value = (answer.values || {})[category] || "";
      const count = value ? counts[normalize(value)] || 0 : 0;
      pointsByPlayer[answer.player_id][category] = value ? (count === 1 ? 20 : 10) : 0;
    }
  }
  return pointsByPlayer;
}

/* =========================================================
   SUPABASE REST-LAYER
   ========================================================= */
async function sbRequest(path, options = {}) {
  const headers = {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json",
    ...(options.headers || {}),
  };

  let response;
  try {
    response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...options, headers });
  } catch {
    const error = new Error("Keine Verbindung zu Supabase.");
    error.network = true;
    throw error;
  }

  if (response.status === 204) return null;

  const body = await response.json().catch(() => ({}));

  if (!response.ok) {
    const error = new Error(body.message || body.hint || `Supabase-Fehler (${response.status})`);
    if (body.code === "PGRST205" || (body.message || "").includes("Could not find the table")) {
      error.schemaMissing = true;
    }
    if (body.code === "23505") error.duplicate = true;
    error.status = response.status;
    throw error;
  }
  return body;
}

function sbSelect(path) { return sbRequest(path); }
function sbInsert(table, values) {
  return sbRequest(table, {
    method: "POST",
    headers: { Prefer: "return=representation" },
    body: JSON.stringify(values),
  });
}
function sbUpsert(table, values) {
  return sbRequest(`${table}?on_conflict=room_code,player_id,round`, {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(values),
  });
}
function sbUpdate(table, filter, values) {
  return sbRequest(`${table}?${filter}`, {
    method: "PATCH",
    headers: { Prefer: "return=representation" },
    body: JSON.stringify(values),
  });
}

function markSchemaMissing(error) {
  if (error && error.schemaMissing) {
    state.schemaMissing = true;
    state.online = false;
  }
}

/* =========================================================
   SNAPSHOT-AUFBAU (aus DB-Zeilen oder lokalem Raum)
   ========================================================= */
function buildSnapshot(room, players, answerRows, playerId) {
  const roundAnswers = answerRows || [];
  const submittedIds = new Set(roundAnswers.map((answer) => answer.player_id));
  const mappedPlayers = players.map((player) => ({
    id: player.id,
    name: player.name,
    score: player.score,
    isHost: Boolean(player.is_host),
    submitted: submittedIds.has(player.id),
  }));

  let myAnswers = null;
  if (room.phase === "answering") {
    const mine = roundAnswers.find((answer) => answer.player_id === playerId);
    if (mine) myAnswers = mine.values || {};
  }

  let results = null;
  if (room.phase === "results" || room.phase === "finished") {
    results = roundAnswers.map((answer) => ({
      playerId: answer.player_id,
      values: answer.values || {},
      points: answer.points || null,
    }));
  }

  return {
    room: {
      code: room.code,
      name: room.name,
      status: room.status,
      phase: room.phase,
      categories: room.categories || [],
      roundLimit: room.round_limit,
      round: room.round,
      currentLetter: room.current_letter,
      usedLetters: room.used_letters || [],
    },
    players: mappedPlayers,
    myAnswers,
    results,
  };
}

/* =========================================================
   REMOTE API (Supabase)
   ========================================================= */
async function remoteLoad(code, playerId) {
  const rooms = await sbSelect(`game_rooms?code=eq.${encodeURIComponent(code)}&select=*`);
  if (!rooms || !rooms.length) throw new Error("Diesen Spielraum gibt es nicht mehr.");
  const room = rooms[0];

  const [players, answerRows] = await Promise.all([
    sbSelect(`game_players?room_code=eq.${encodeURIComponent(code)}&order=joined_at.asc`),
    room.round > 0
      ? sbSelect(`game_answers?room_code=eq.${encodeURIComponent(code)}&round=eq.${room.round}`)
      : Promise.resolve([]),
  ]);

  return buildSnapshot(room, players || [], answerRows || [], playerId);
}

async function remoteCreate({ hostName, roomName, categories, roundLimit }) {
  let room = null;
  let code = makeCode();
  for (let attempt = 0; attempt < 6 && !room; attempt++) {
    try {
      const rows = await sbInsert("game_rooms", {
        code,
        name: (roomName || "").trim() || `${hostName}s Runde`,
        host_player_id: state.playerId,
        status: "lobby",
        phase: "lobby",
        categories,
        round_limit: roundLimit,
        round: 0,
        current_letter: null,
        used_letters: [],
      });
      room = rows[0];
    } catch (error) {
      if (error.duplicate) { code = makeCode(); continue; }
      throw error;
    }
  }
  if (!room) throw new Error("Code konnte nicht vergeben werden.");

  await sbInsert("game_players", {
    id: state.playerId,
    room_code: room.code,
    name: hostName,
    score: 0,
    is_host: true,
  });

  return remoteLoad(room.code, state.playerId);
}

async function remoteJoin(code, name) {
  const rooms = await sbSelect(`game_rooms?code=eq.${encodeURIComponent(code)}&select=*`);
  if (!rooms || !rooms.length) throw new Error("Diesen Spielraum gibt es nicht mehr.");
  const room = rooms[0];
  if (room.status !== "lobby") throw new Error("Diese Runde läuft bereits.");

  const players = await sbSelect(`game_players?room_code=eq.${encodeURIComponent(code)}&select=id`);
  if (players && players.length >= 12) throw new Error("Raum ist voll (max. 12).");

  const existing = (players || []).find((player) => player.id === state.playerId);
  if (!existing) {
    try {
      await sbInsert("game_players", {
        id: state.playerId,
        room_code: code,
        name,
        score: 0,
        is_host: false,
      });
    } catch (error) {
      if (!error.duplicate) throw error;
    }
  }
  return remoteLoad(code, state.playerId);
}

async function remoteAction(code, actionName) {
  const snapshot = state.snapshot;
  if (!snapshot) throw new Error("Raum nicht geladen.");
  const me = snapshot.players.find((player) => player.id === state.playerId);
  if (!me || !me.isHost) throw new Error("Nur die Spielleitung.");

  if (actionName === "start") {
    if (snapshot.room.phase !== "lobby") throw new Error("Läuft bereits.");
    if (snapshot.players.length < 2) throw new Error("Warte auf Mitspieler.");
    const letter = pickLetter(snapshot.room.usedLetters);
    if (!letter) throw new Error("Keine Buchstaben mehr frei.");
    const updated = await sbUpdate(
      "game_rooms",
      `code=eq.${encodeURIComponent(code)}&phase=eq.lobby`,
      { status: "playing", phase: "answering", round: 1, current_letter: letter, used_letters: [letter] },
    );
    if (!updated || !updated.length) throw new Error("Runde wurde bereits gestartet.");
    return remoteLoad(code, state.playerId);
  }

  if (snapshot.room.phase !== "results") throw new Error("Runde noch nicht ausgewertet.");

  if (snapshot.room.round >= snapshot.room.roundLimit) {
    await sbUpdate(`code=eq.${encodeURIComponent(code)}`, { status: "finished", phase: "finished" });
    return remoteLoad(code, state.playerId);
  }

  const letter = pickLetter(snapshot.room.usedLetters);
  const nextRound = snapshot.room.round + 1;
  const usedLetters = [...snapshot.room.usedLetters, letter || ""].filter(Boolean);
  if (!letter) {
    await sbUpdate(`code=eq.${encodeURIComponent(code)}`, { status: "finished", phase: "finished" });
    return remoteLoad(code, state.playerId);
  }
  const updated = await sbUpdate(
    "game_rooms",
    `code=eq.${encodeURIComponent(code)}&phase=eq.results`,
    { phase: "answering", round: nextRound, current_letter: letter, used_letters: usedLetters },
  );
  if (!updated || !updated.length) throw new Error("Runde wurde bereits fortgesetzt.");
  return remoteLoad(code, state.playerId);
}

async function remoteAnswer(code, values, snapshot) {
  const letter = snapshot.room.currentLetter || "";
  const cleaned = {};
  for (const category of snapshot.room.categories) {
    const raw = String(values[category] ?? "").trim().slice(0, 40);
    if (raw && raw[0].toLocaleUpperCase("de-DE") !== letter) {
      throw new Error(`„${raw}“ beginnt nicht mit ${letter}.`);
    }
    cleaned[category] = raw;
  }
  if (!Object.values(cleaned).some(Boolean)) throw new Error("Mindestens ein Wort eingeben.");

  await sbUpsert("game_answers", {
    room_code: code,
    player_id: state.playerId,
    round: snapshot.room.round,
    values: cleaned,
    points: null,
  });

  const fresh = await remoteLoad(code, state.playerId);
  await maybeEvaluate(fresh);
  return fresh;
}

/* Wertung: läuft beim Host aus, sobald alle Antworten da sind.
   Bedingtes Update auf phase='results' verhindert doppelte Wertung. */
async function maybeEvaluate(snapshot) {
  if (!state.online || !snapshot || state.evaluating) return;
  if (snapshot.room.phase !== "answering" || snapshot.room.round < 1) return;
  if (!snapshot.players.some((player) => player.id === state.playerId && player.isHost)) return;

  const allSubmitted = snapshot.players.length > 0 && snapshot.players.every((player) => player.submitted);
  if (!allSubmitted) return;

  state.evaluating = true;
  try {
    const code = snapshot.room.code;
    const claimed = await sbUpdate(
      "game_rooms",
      `code=eq.${encodeURIComponent(code)}&phase=eq.answering&round=eq.${snapshot.room.round}`,
      { phase: "results" },
    );
    if (!claimed || !claimed.length) return; // schon ausgewertet

    const answers = await sbSelect(
      `game_answers?room_code=eq.${encodeURIComponent(code)}&round=eq.${snapshot.room.round}`,
    );
    if (!answers || answers.length < snapshot.players.length) return;

    const points = calculatePoints(snapshot.room.categories, answers);

    for (const answer of answers) {
      await sbUpdate(
        "game_answers",
        `room_code=eq.${encodeURIComponent(code)}&player_id=eq.${encodeURIComponent(answer.player_id)}&round=eq.${snapshot.room.round}`,
        { points: points[answer.player_id] || {} },
      );
    }
    for (const player of snapshot.players) {
      const earned = Object.values(points[player.id] || {}).reduce((sum, value) => sum + value, 0);
      if (earned === 0 && !points[player.id]) continue;
      await sbUpdate(
        "game_players",
        `room_code=eq.${encodeURIComponent(code)}&id=eq.${encodeURIComponent(player.id)}`,
        { score: player.score + earned },
      );
    }
  } catch (error) {
    markSchemaMissing(error);
  } finally {
    state.evaluating = false;
  }
}

/* =========================================================
   LOKALER FALLBACK (kein Supabase-Schema: Tabs synchron)
   ========================================================= */
function readAllRooms() {
  try { return JSON.parse(localStorage.getItem(LOCAL_STORE_KEY) || "{}"); }
  catch { return {}; }
}
function writeAllRooms(rooms) {
  try { localStorage.setItem(LOCAL_STORE_KEY, JSON.stringify(rooms)); } catch { /* voll */ }
}
function readRoom(code) { return readAllRooms()[code] || null; }
function writeRoom(room) {
  const rooms = readAllRooms();
  rooms[room.code] = room;
  writeAllRooms(rooms);
  try { window.__bc?.postMessage({ type: "sync", code: room.code, at: Date.now() }); } catch { /* egal */ }
}

function localSnapshot(room, playerId) {
  const roundAnswers = (room.answers && room.answers[room.round]) || {};
  const submittedIds = new Set(Object.keys(roundAnswers));
  let myAnswers = null;
  if (room.phase === "answering" && roundAnswers[playerId]) myAnswers = roundAnswers[playerId].values;
  let results = null;
  if (room.phase === "results" || room.phase === "finished") {
    results = Object.entries(roundAnswers).map(([pid, entry]) => ({
      playerId: pid, values: entry.values, points: entry.points || null,
    }));
  }
  return {
    room: {
      code: room.code, name: room.name, status: room.status, phase: room.phase,
      categories: room.categories, roundLimit: room.roundLimit, round: room.round,
      currentLetter: room.currentLetter, usedLetters: room.usedLetters || [],
    },
    players: room.players.map((player) => ({ ...player, submitted: submittedIds.has(player.id) })),
    myAnswers,
    results,
  };
}

function localCreate({ name, roomName, categories, roundLimit }) {
  let code = makeCode();
  for (let i = 0; i < 6 && readRoom(code); i++) code = makeCode();
  const room = {
    code,
    name: (roomName || "").trim() || `${name}s Runde`,
    hostPlayerId: state.playerId,
    status: "lobby", phase: "lobby",
    categories, roundLimit, round: 0, currentLetter: null, usedLetters: [],
    players: [{ id: state.playerId, name, score: 0, isHost: true }],
    answers: {}, createdAt: Date.now(),
  };
  writeRoom(room);
  return localSnapshot(room, state.playerId);
}

function localJoin(code, name) {
  const room = readRoom(code);
  if (!room) throw new Error("Diesen Spielraum gibt es nicht mehr.");
  if (room.status !== "lobby") throw new Error("Diese Runde läuft bereits.");
  if (room.players.length >= 12) throw new Error("Raum ist voll (max. 12).");
  if (!room.players.some((player) => player.id === state.playerId)) {
    room.players.push({ id: state.playerId, name, score: 0, isHost: false });
    writeRoom(room);
  }
  return localSnapshot(room, state.playerId);
}

function localScoreRound(room, roundAnswers) {
  const points = calculatePoints(room.categories, Object.entries(roundAnswers).map(([pid, entry]) => ({
    player_id: pid, values: entry.values,
  })));
  for (const [pid, entry] of Object.entries(roundAnswers)) {
    entry.points = points[pid] || {};
    const earned = Object.values(entry.points).reduce((sum, value) => sum + value, 0);
    const player = room.players.find((item) => item.id === pid);
    if (player) player.score += earned;
  }
}

function localAction(actionName) {
  const room = readRoom(state.roomCode);
  if (!room) throw new Error("Spielraum nicht gefunden.");
  if (room.hostPlayerId !== state.playerId) throw new Error("Nur die Spielleitung.");

  if (actionName === "start") {
    if (room.phase !== "lobby") throw new Error("Läuft bereits.");
    if (room.players.length < 2) throw new Error("Warte auf Mitspieler.");
    const letter = pickLetter(room.usedLetters);
    room.status = "playing"; room.phase = "answering"; room.round = 1;
    room.currentLetter = letter; room.usedLetters = [letter];
    writeRoom(room);
    return localSnapshot(room, state.playerId);
  }

  if (room.phase !== "results") throw new Error("Runde noch nicht ausgewertet.");
  if (room.round >= room.roundLimit) {
    room.status = "finished"; room.phase = "finished";
    writeRoom(room);
    return localSnapshot(room, state.playerId);
  }
  const letter = pickLetter(room.usedLetters);
  if (!letter) {
    room.status = "finished"; room.phase = "finished";
    writeRoom(room);
    return localSnapshot(room, state.playerId);
  }
  room.phase = "answering"; room.round += 1;
  room.currentLetter = letter; room.usedLetters.push(letter);
  writeRoom(room);
  return localSnapshot(room, state.playerId);
}

function localAnswer(values) {
  const room = readRoom(state.roomCode);
  if (!room) throw new Error("Spielraum nicht gefunden.");
  if (room.phase !== "answering" || !room.currentLetter) throw new Error("Runde nicht offen.");

  const round = room.round;
  room.answers = room.answers || {};
  if (!room.answers[round]) room.answers[round] = {};
  if (room.answers[round][state.playerId]) return localSnapshot(room, state.playerId);

  const cleaned = {};
  for (const category of room.categories) {
    const raw = String(values[category] ?? "").trim().slice(0, 40);
    if (raw && raw[0].toLocaleUpperCase("de-DE") !== room.currentLetter) {
      throw new Error(`„${raw}“ beginnt nicht mit ${room.currentLetter}.`);
    }
    cleaned[category] = raw;
  }
  if (!Object.values(cleaned).some(Boolean)) throw new Error("Mindestens ein Wort eingeben.");

  room.answers[round][state.playerId] = { values: cleaned, points: null };
  const allDone = room.players.every((player) => Boolean(room.answers[round][player.id]));
  if (allDone) {
    localScoreRound(room, room.answers[round]);
    room.phase = "results";
  }
  writeRoom(room);
  return localSnapshot(room, state.playerId);
}

/* =========================================================
   API-FASSADE (online oder lokal)
   ========================================================= */
const api = {
  create(payload) {
    return state.online ? remoteCreate(payload) : Promise.resolve(localCreate(payload));
  },
  join(code, name) {
    return state.online ? remoteJoin(code, name) : Promise.resolve(localJoin(code, name));
  },
  load(code, playerId = state.playerId) {
    return state.online ? remoteLoad(code, playerId) : (() => {
      const room = readRoom(code);
      if (!room) throw new Error("Diesen Spielraum gibt es nicht mehr.");
      return Promise.resolve(localSnapshot(room, playerId));
    })();
  },
  action(code, actionName) {
    return state.online ? remoteAction(code, actionName) : Promise.resolve(localAction(actionName));
  },
  answer(code, values) {
    return state.online ? remoteAnswer(code, values, state.snapshot) : Promise.resolve(localAnswer(values));
  },
};

/* =========================================================
   LIVE-SYNC (Supabase Realtime + Polling; lokal: BroadcastChannel)
   ========================================================= */
let syncTimer = null;
function scheduleRefresh() {
  if (state.screen !== "room" || !state.roomCode || !state.playerId) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { void refreshRoom(true); }, 120);
}

async function refreshRoom(silent) {
  try {
    const data = await api.load(state.roomCode, state.playerId);
    const roundKey = `${state.roomCode}:${data.room.round}`;
    if (state.lastRoundKey !== roundKey) {
      state.answers = {};
      state.lastRoundKey = roundKey;
    }
    if (data.myAnswers) state.answers = { ...data.myAnswers };
    state.snapshot = data;
    render();
    if (state.online) await maybeEvaluate(data);
    return data;
  } catch (err) {
    markSchemaMissing(err);
    if (!silent) setError(err.message);
    render();
    return null;
  }
}

function startRealtime(code) {
  if (!state.online) return;
  try {
    const host = SUPABASE_URL.replace("https://", "");
    const ws = new WebSocket(`wss://${host}/realtime/v1/websocket?apikey=${encodeURIComponent(SUPABASE_KEY)}&vsn=1.0.0`);
    const topic = `realtime:room:${code}`;
    const heartbeat = setInterval(() => {
      if (ws.readyState === 1) ws.send(JSON.stringify([null, "hb", "phoenix", "heartbeat", {}]));
    }, 30000);

    ws.addEventListener("open", () => {
      ws.send(JSON.stringify(["1", "1", topic, {
        access_token: SUPABASE_KEY,
        config: {
          postgres_changes: [
            { event: "*", schema: "public", table: "game_rooms", filter: `code=eq.${code}` },
            { event: "*", schema: "public", table: "game_players", filter: `room_code=eq.${code}` },
            { event: "*", schema: "public", table: "game_answers", filter: `room_code=eq.${code}` },
          ],
        },
      }, "phx_join"]));
    });

    ws.addEventListener("message", (event) => {
      try {
        const frame = JSON.parse(event.data);
        if (!Array.isArray(frame)) return;
        const event_name = frame[3];
        if (event_name === "postgres_changes" || event_name === "broadcast") scheduleRefresh();
        if (event_name === "phx_reply" && frame[5]?.status === "error") { try { ws.close(); } catch { /* egal */ } }
      } catch { /* frame ignorieren */ }
    });

    ws.addEventListener("error", () => { /* Polling übernimmt */ });
    ws.addEventListener("close", () => { clearInterval(heartbeat); });
    window.__realtime = { ws, heartbeat };
  } catch { /* Polling übernimmt */ }
}

function startLocalChannel() {
  try {
    window.__bc = new BroadcastChannel(CHANNEL_NAME);
    window.__bc.onmessage = (event) => {
      if (event.data?.code === state.roomCode) scheduleRefresh();
    };
  } catch { /* nicht unterstützt → storage-Event */ }
  window.addEventListener("storage", onStorageEvent);
}

function onStorageEvent(event) {
  if (event.key === LOCAL_STORE_KEY && event.newValue !== null) scheduleRefresh();
}

function startLiveSync() {
  stopLiveSync();
  if (state.online) {
    startRealtime(state.roomCode);
    window.__poll = setInterval(() => {
      if (document.visibilityState === "visible") void refreshRoom(true);
    }, 3000);
  } else {
    startLocalChannel();
  }
}

function stopLiveSync() {
  try { window.__realtime?.ws?.close(); clearInterval(window.__realtime?.heartbeat); } catch { /* egal */ }
  window.__realtime = null;
  try { window.__bc?.close(); } catch { /* egal */ }
  window.__bc = null;
  clearInterval(window.__poll);
  window.__poll = null;
  window.removeEventListener("storage", onStorageEvent);
}

async function probeSupabase() {
  try {
    await sbSelect("game_rooms?select=code&limit=1");
    state.online = true;
    state.schemaMissing = false;
  } catch (error) {
    if (error.schemaMissing) {
      state.online = false;
      state.schemaMissing = true;
    } else if (error.network) {
      state.online = false;
    } else {
      state.online = true;
    }
  }
}

/* =========================================================
   AKTIONEN
   ========================================================= */
async function createRoom() {
  const cleanName = state.name.trim();
  if (cleanName.length < 2) { setError("Name zu kurz."); return render(); }

  state.busy = true;
  setError("");
  render();
  if (!state.playerId) state.playerId = uid();

  try {
    const data = await api.create({
      hostName: cleanName,
      roomName: state.roomName,
      playerId: state.playerId,
      categories: state.categories,
      roundLimit: state.roundLimit,
    });
    const code = data.room.code;
    if (!code) throw new Error("Fehler beim Erstellen.");

    localStorage.setItem("wortwirbel-player-name", cleanName);
    localStorage.setItem(`wortwirbel-player-${code}`, state.playerId);
    state.roomCode = code;
    state.snapshot = null;
    state.lastRoundKey = "";
    setHash(code);
    state.screen = "room";
    startLiveSync();
    await refreshRoom(true);
  } catch (err) {
    markSchemaMissing(err);
    setError(err.message || "Fehler beim Erstellen.");
  } finally {
    state.busy = false;
    render();
  }
}

async function joinRoom() {
  const cleanName = state.name.trim();
  const cleanCode = state.roomCode.trim().toUpperCase();
  if (cleanName.length < 2) { setError("Name zu kurz."); return render(); }
  if (!/^[A-Z0-9]{6}$/.test(cleanCode)) { setError("Code besteht aus 6 Zeichen."); return render(); }

  state.busy = true;
  setError("");
  render();

  const storageKey = `wortwirbel-player-${cleanCode}`;
  const storedId = localStorage.getItem(storageKey);
  state.playerId = storedId || state.playerId || uid();

  try {
    const data = await api.join(cleanCode, cleanName);
    localStorage.setItem("wortwirbel-player-name", cleanName);
    localStorage.setItem(storageKey, state.playerId);
    state.roomCode = cleanCode;
    state.snapshot = data;
    state.lastRoundKey = "";
    setHash(cleanCode);
    state.screen = "room";
    startLiveSync();
    await refreshRoom(true);
  } catch (err) {
    markSchemaMissing(err);
    setError(err.message || "Beitritt fehlgeschlagen.");
  } finally {
    state.busy = false;
    render();
  }
}

async function runAction(actionName) {
  if (!state.snapshot) return;
  state.busy = true;
  setError("");
  render();
  try {
    const data = await api.action(state.snapshot.room.code, actionName);
    state.snapshot = data;
    state.lastRoundKey = `${state.roomCode}:${data.room.round}`;
    if (data.room.phase === "answering") state.answers = {};
    render();
  } catch (err) {
    markSchemaMissing(err);
    setError(err.message || "Aktion fehlgeschlagen.");
  } finally {
    state.busy = false;
    render();
  }
}

async function submitAnswers() {
  if (!state.snapshot) return;
  const letter = state.snapshot.room.currentLetter || "";
  const invalid = state.snapshot.room.categories.some((category) => {
    const value = (state.answers[category] || "").trim();
    return value && value[0].toLocaleUpperCase("de-DE") !== letter;
  });
  if (invalid) { setError(`Muss mit ${letter} beginnen.`); return render(); }
  if (!Object.values(state.answers).some((value) => String(value).trim())) {
    setError("Mindestens ein Wort eingeben."); return render();
  }

  state.busy = true;
  setError("");
  render();
  try {
    const data = await api.answer(state.snapshot.room.code, state.answers);
    state.snapshot = data;
    render();
  } catch (err) {
    markSchemaMissing(err);
    setError(err.message || "Speichern fehlgeschlagen.");
  } finally {
    state.busy = false;
    render();
  }
}

function addCategory() {
  const value = state.customCategory.trim().slice(0, 28);
  if (!value) return;
  if (state.categories.some((category) => normalize(category) === normalize(value))) {
    setError("Gibt es schon."); return render();
  }
  if (state.categories.length >= 8) {
    setError("Maximal 8 Kategorien."); return render();
  }
  state.categories = [...state.categories, value];
  state.customCategory = "";
  setError("");
  render();
}

function openJoin() {
  setError("");
  state.screen = "join";
  render();
}

function returnHome() {
  stopLiveSync();
  state.screen = "home";
  state.snapshot = null;
  state.playerId = "";
  state.roomCode = "";
  state.lastRoundKey = "";
  setError("");
  setHash("");
  render();
}

async function copyText(value) {
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(value);
    } else {
      const input = document.createElement("textarea");
      input.value = value;
      input.style.position = "fixed";
      input.style.opacity = "0";
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      input.remove();
    }
    state.copied = true;
    render();
    setTimeout(() => { state.copied = false; render(); }, 1800);
  } catch {
    setError("Kopieren fehlgeschlagen."); render();
  }
}

function setHash(code) {
  try {
    if (code) history.replaceState(null, "", `${location.pathname}${location.search}#${code}`);
    else history.replaceState(null, "", location.pathname + location.search);
  } catch { /* egal */ }
}

      const cells = sorted.map((player) => {
        const result = resultMap.get(player.id);
        const value = (result && result.values[category]) || "—";
        const points = (result && result.points && result.points[category]) ?? 0;
        return `<td><span class="${value === "—" ? "answer-empty" : ""}">${esc(value)}</span><b class="points-tag">+${points}</b></td>`;
      }).join("");
      return `<tr><th>${esc(category)}</th>${cells}</tr>`;
    }).join("");

    content = `
      <div class="round-row">
        <span>Runde ${snap.room.round}/${snap.room.roundLimit}</span>
        <span class="letter-badge">${esc(snap.room.currentLetter)}</span>
      </div>
      <ul class="score-list">${scores}</ul>
      <div class="table-scroll">
        <table class="results-table">
          <thead><tr><th></th>${header}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${isHost
        ? `<button class="primary-button full-width" data-action="next" ${state.busy ? "disabled" : ""}>
            ${state.busy ? "…" : snap.room.round >= snap.room.roundLimit ? "Endstand" : "Nächste Runde"}
           </button>`
        : `<p class="hint-text">Warte auf nächste Runde …</p>`}
    `;
  }

  if (snap.room.phase === "finished") {
    const scores = sorted.map((player, index) => `
      <li>
        ${avatarHtml(player.name, index)}
        <span>${esc(player.name)}${player.id === state.playerId ? " (du)" : ""}</span>
        <b>${player.score}</b>
      </li>`).join("");
    content = `
      <p class="winner-text">${esc(sorted[0] ? sorted[0].name : "")} gewinnt 🎉</p>
      <ul class="score-list">${scores}</ul>
      <button class="primary-button full-width" data-action="home">Neues Spiel</button>
    `;
  }

  return `
    <main class="room-main">
      ${errorHtml()}
      <section class="card room-card">${content}</section>
    </main>`;
}

function render() {
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const selectionStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;

  renderTopbar();
  if (state.screen === "home") mainEl.innerHTML = renderHome();
  else if (state.screen === "join") mainEl.innerHTML = renderJoin();
  else mainEl.innerHTML = renderRoom();

  if (focusId) {
    const restored = document.getElementById(focusId);
    if (restored) {
      restored.focus({ preventScroll: true });
      if (selectionStart !== null && typeof restored.setSelectionRange === "function") {
        try { restored.setSelectionRange(selectionStart, selectionStart); } catch { /* egal */ }
      }
    }
  }
}

/* =========================================================
   EVENTS (Delegation)
   ========================================================= */
document.addEventListener("click", (event) => {
  const target = event.target.closest("[data-action], [data-rounds], [data-remove-category]");
  if (!target) return;

  if (target.dataset.action === "home") return returnHome();
  if (target.dataset.action === "open-join") return openJoin();
  if (target.dataset.action === "add-category") return addCategory();
  if (target.dataset.action === "start") return void runAction("start");
  if (target.dataset.action === "next") return void runAction("next");
  if (target.dataset.action === "copy-code") return void copyText(state.roomCode);
  if (target.dataset.action === "copy-link") return void copyText(`${location.origin}${location.pathname}${location.search}#${state.roomCode}`);

  if (target.dataset.rounds) {
    state.roundLimit = Number(target.dataset.rounds);
    return render();
  }

  if (target.dataset.removeCategory) {
    if (state.categories.length <= 3) return;
    state.categories = state.categories.filter((item) => item !== target.dataset.removeCategory);
    return render();
  }
});

document.addEventListener("input", (event) => {
  const el = event.target;

  if (el.dataset.field) {
    const key = el.dataset.field;
    let value = el.value;
    if (key === "roomCode") value = value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    state[key] = value;
    if (key === "roomCode" && el.value !== value) el.value = value;
    if (state.error) setError("");
    return;
  }

  if (el.dataset.answer) {
    state.answers[el.dataset.answer] = el.value;
    const letter = state.snapshot?.room.currentLetter || "";
    const invalid = Boolean(el.value.trim() && el.value.trim()[0].toLocaleUpperCase("de-DE") !== letter);
    el.closest(".answer-field")?.classList.toggle("answer-field-invalid", invalid);
  }
});

document.addEventListener("submit", (event) => {
  event.preventDefault();
  if (event.target.id === "create-form") void createRoom();
  if (event.target.id === "join-form") void joinRoom();
  if (event.target.id === "answer-form") void submitAnswers();
});

document.addEventListener("keydown", (event) => {
  if (event.target.id === "custom-category" && event.key === "Enter") {
    event.preventDefault();
    addCategory();
  }
  if (event.target.id === "invite-code") {
    state.roomCode = event.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  }
});

/* =========================================================
   START
   ========================================================= */
async function boot() {
  const savedName = localStorage.getItem("wortwirbel-player-name");
  if (savedName) state.name = savedName;

  // Bestehende Spieler-ID wiederverwenden, sonst neu
  const hash = location.hash.replace("#", "").toUpperCase();
  const query = new URLSearchParams(location.search).get("room");
  const code = /^[A-Z0-9]{6}$/.test(hash) ? hash : /^[A-Z0-9]{6}$/.test(query || "") ? query.toUpperCase() : "";

  await probeSupabase();

  if (code) {
    state.roomCode = code;
    const stored = localStorage.getItem(`wortwirbel-player-${code}`);
    if (stored) {
      state.playerId = stored;
      try {
        const data = await api.load(code, stored);
        state.snapshot = data;
        state.lastRoundKey = `${code}:${data.room.round}`;
        state.screen = "room";
        startLiveSync();
      } catch {
        state.screen = "join";
        state.playerId = "";
      }
    } else {
      state.screen = "join";
    }
  }

  render();
}

void boot();
</script>
